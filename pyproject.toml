[project]
name = "shiny-pokemon"
version = "1.0.0"
description = "Shiny Pokemon probability calculator for Fire Red and Leaf Green with Monte Carlo simulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "numpy>=2.0.0",
    "PySide6>=6.7.0",
    "plotly>=6.6.0",
    "pytest>=9.0.2",
]

[project.scripts]
shiny-cli = "shiny_pokemon.cli:main"

[project.gui-scripts]
shiny-gui = "shiny_pokemon.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
