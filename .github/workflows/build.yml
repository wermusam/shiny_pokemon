name: Build Windows exe

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          uv add --dev pyinstaller

      - name: Build exe
        run: |
          uv run pyinstaller --onefile --windowed --name ShinyPokemonCalculator --add-data "shiny_pokemon/data;shiny_pokemon/data" shiny_pokemon/gui/app.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ShinyPokemonCalculator
          path: dist/ShinyPokemonCalculator.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ShinyPokemonCalculator.exe
          generate_release_notes: true
