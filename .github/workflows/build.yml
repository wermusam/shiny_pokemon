name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync
          uv add --dev pyinstaller

      # Windows: one single .exe (unchanged)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller --onefile --windowed --name ShinyPokemonCalculator-Windows.exe --add-data "shiny_pokemon/data;shiny_pokemon/data" shiny_pokemon/gui/app.py

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ShinyPokemonCalculator-Windows.exe
          path: dist/ShinyPokemonCalculator-Windows.exe

      # macOS: a real double-clickable .app, zipped into one download
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyinstaller --windowed --name ShinyPokemonCalculator-Mac --add-data "shiny_pokemon/data:shiny_pokemon/data" shiny_pokemon/gui/app.py
          ditto -c -k --keepParent "dist/ShinyPokemonCalculator-Mac.app" "dist/ShinyPokemonCalculator-Mac.zip"

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ShinyPokemonCalculator-Mac.zip
          path: dist/ShinyPokemonCalculator-Mac.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
